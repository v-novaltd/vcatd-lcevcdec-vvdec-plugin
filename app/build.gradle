plugins {
    id 'com.android.library'
    id 'maven-publish'
}

group   = 'com.roncatech.vcat'
version = '0.0.1'

def vvdecAbis = ['arm64-v8a']   // arm64-v8a only for the LCEVC integration
def minApi    = 30

def propertyBool = { propertyName ->
    def value = project.findProperty(propertyName)
    value != null && !['OFF', 'FALSE', '0', 'NO'].contains(value.toString().toUpperCase())
}

def buildWithPerfettoSystemSink = propertyBool('buildWithPerfettoSystemSink')
def buildWithConan = propertyBool('buildWithConan')
def conanClangVersion = (findProperty('CONAN_CLANG_VERSION') ?: '18').toString()
def conanDepsRoot = layout.buildDirectory.dir('conan')

android {
    namespace 'com.roncatech.libvcat.lcevcvvdec'
    compileSdk 34
    ndkVersion "27.3.13750724"

    defaultConfig {
        minSdk minApi
        targetSdk 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters.addAll(vvdecAbis) }

        externalNativeBuild {
            cmake {
                arguments "-DVVDEC_INSTALL_ARM64_V8A=${layout.buildDirectory.dir('vvdec/install-arm64-v8a').get().asFile.absolutePath}",
                          "-DLCEVC_SRC_DIR=${layout.buildDirectory.dir('lcevc/src').get().asFile.absolutePath}",
                          "-DVN_SDK_TRACING_SYSTEM_SINK=${buildWithPerfettoSystemSink}"
                if (buildWithConan) {
                    arguments "-DCONAN_DEPS_ROOT=${conanDepsRoot.get().asFile.absolutePath}"
                }
            }
        }

        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug { debuggable true }
    }

    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }

    sourceSets { androidTest.assets.srcDir(layout.buildDirectory.dir('generated/decoder-assets')) }

    testOptions { unitTests.returnDefaultValues = true }

    publishing {
        singleVariant("release") { withSourcesJar() }
    }
}

// vvdec build (CMake/Ninja).

def vvdecWorkRoot = layout.buildDirectory.dir('vvdec').get().asFile
def vvdecSrcDir   = new File(vvdecWorkRoot, 'src')

def vvdecRef    = (findProperty('vvdecRef')    ?: 'v3.2.1') as String
def vvdecRemote = (findProperty('vvdecRemote') ?: 'https://github.com/fraunhoferhhi/vvdec.git') as String
def vvdecLocal  = (findProperty('vvdecLocal')  ?: System.getenv('VVDEC_SRC')) as String

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

def resolveCmakeBinDir = {
    def croot = new File(android.sdkDirectory, 'cmake')
    def valid = croot.listFiles()
            ?.findAll { it.isDirectory() && new File(it, isWindows ? 'bin/cmake.exe' : 'bin/cmake').exists() }
    if (!valid) throw new GradleException("No CMake found under ${croot}. Install 'CMake' via the Android SDK Manager.")
    def chosen = valid.find { it.name == '3.22.1' }
            ?: valid.findAll { it.name.startsWith('3.') }.sort { a, b -> b.name <=> a.name }.find { true }
            ?: valid.sort { a, b -> b.name <=> a.name }.first()
    return new File(chosen, 'bin')
}

// LCEVCdec (CPU and Vulkan)

def lcevcWorkRoot = layout.buildDirectory.dir('lcevc').get().asFile
def lcevcSrcDir   = new File(lcevcWorkRoot, 'src')

def lcevcRef = (findProperty('lcevcRef') ?: 'main') as String
def lcevcRemote = (findProperty('lcevcRemote') ?: 'https://github.com/v-novaltd/LCEVCdec.git') as String
def lcevcLocal  = (findProperty('lcevcLocal')  ?: System.getenv('LCEVC_SRC')) as String

tasks.register('fetchLcevc') {
    outputs.dir(lcevcSrcDir)
    inputs.property('lcevcResolvedSource', lcevcLocal ?: "${lcevcRemote}#${lcevcRef}")
    if (lcevcLocal) inputs.dir(lcevcLocal).withPropertyName('localLcevcSource')
    doLast {
        lcevcWorkRoot.mkdirs()

        if (lcevcLocal) {
            delete lcevcSrcDir
            copy { from lcevcLocal; into lcevcSrcDir; exclude '.git' }
            return
        }

        logger.lifecycle("fetchLcevc: cloning ${lcevcRemote} @ ${lcevcRef}")
        def clearGitEnv = { s -> s.environment.remove('GIT_DIR'); s.environment.remove('GIT_WORK_TREE') }

        delete lcevcSrcDir
        exec {
            workingDir lcevcWorkRoot
            clearGitEnv(delegate)
            // The Conan recipe derives its version with `git describe`, so the clone must retain
            // the tagged history reachable from the selected ref.
            commandLine 'git', 'clone', '--branch', lcevcRef, lcevcRemote, 'src'
        }
    }
}

def installConanDependencies = tasks.register('installConanDependencies') {
    description = 'Install Android LCEVCdec dependencies using Conan'
    group = 'build setup'

    dependsOn 'fetchLcevc'
    inputs.property('ndkVersion', android.ndkVersion)
    inputs.property('clangVersion', conanClangVersion)
    inputs.property('androidApiLevel', minApi)
    inputs.property('buildWithPerfettoSystemSink', buildWithPerfettoSystemSink)

    onlyIf { buildWithConan }

    doLast {
        def configurations = gradle.taskGraph.allTasks.collect { configuredTask ->
            def match = configuredTask.name =~ /^configureCMake(Debug|Release|RelWithDebInfo)\[([^]]+)]$/
            match.matches() ? [buildType: match.group(1), abi: match.group(2)] : null
        }.findAll().unique()

        configurations.each { configuration ->
            def outputDir = conanDepsRoot.get().dir("${configuration.buildType}/${configuration.abi}").asFile
            outputDir.mkdirs()
            providers.exec {
                commandLine(
                        'conan', 'install', new File(lcevcSrcDir, 'conanfile.py'),
                        "--install-folder=${outputDir}",
                        '--build=missing',
                        '--profile:build=default',
                        '--settings:host=os=Android',
                        "--settings:host=os.api_level=${minApi}",
                        '--settings:host=arch=armv8',
                        '--settings:host=compiler=clang',
                        "--settings:host=compiler.version=${conanClangVersion}",
                        '--settings:host=compiler.libcxx=c++_static',
                        "--settings:host=build_type=${configuration.buildType}",
                        '--options=base_decoder=none',
                        '--options=vulkan=True',
                        "--options=tracing=${buildWithPerfettoSystemSink ? 'True' : 'False'}",
                        '--options=json_config=False',
                        "--conf:host=tools.android:ndk_path=${android.ndkDirectory}"
                )
            }.result.get().assertNormalExitValue()
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake')) {
        task.dependsOn 'fetchLcevc'
        if (buildWithConan) {
            task.dependsOn installConanDependencies
        }
    }
}

tasks.register('fetchVvdec') {
    outputs.dir(vvdecSrcDir)
    inputs.property('vvdecResolvedSource', vvdecLocal ?: "${vvdecRemote}#${vvdecRef}")
    if (vvdecLocal) inputs.dir(vvdecLocal).withPropertyName('localVvdecSource')
    doLast {
        vvdecWorkRoot.mkdirs()

        if (vvdecLocal) {
            delete vvdecSrcDir
            copy { from vvdecLocal; into vvdecSrcDir; exclude '.git' }
            return
        }
        def clearGitEnv = { s -> s.environment.remove('GIT_DIR'); s.environment.remove('GIT_WORK_TREE') }

        if (!vvdecSrcDir.exists()) {
            exec { workingDir vvdecWorkRoot; clearGitEnv(delegate)
                commandLine 'git', 'clone', '--depth', '1', '--branch', vvdecRef, vvdecRemote, 'src' }
        } else if (!new File(vvdecSrcDir, '.git').exists()) {
            delete vvdecSrcDir
            exec { workingDir vvdecWorkRoot; clearGitEnv(delegate)
                commandLine 'git', 'clone', '--depth', '1', '--branch', vvdecRef, vvdecRemote, 'src' }
        } else {
            // A shallow fetch of a tag may only populate FETCH_HEAD, without creating a local tag.
            exec { workingDir vvdecSrcDir; clearGitEnv(delegate); commandLine 'git', 'fetch', '--depth', '1', '--force', 'origin', vvdecRef }
            exec { workingDir vvdecSrcDir; clearGitEnv(delegate); commandLine 'git', 'checkout', '-f', '--detach', 'FETCH_HEAD' }
            exec { workingDir vvdecSrcDir; clearGitEnv(delegate); commandLine 'git', 'clean', '-xfd' }
        }
    }
}

vvdecAbis.each { abi ->
    def buildDir   = new File(vvdecWorkRoot, "build-${abi}")
    def installDir = new File(vvdecWorkRoot, "install-${abi}")

    tasks.register("buildVvdec_${abi}") {
        dependsOn 'fetchVvdec'
        inputs.dir(vvdecSrcDir)
        outputs.dir(installDir)
        doLast {
            def binDir   = resolveCmakeBinDir()
            def cmakeExe = new File(binDir, isWindows ? 'cmake.exe' : 'cmake').absolutePath
            def ninjaExe = new File(binDir, isWindows ? 'ninja.exe' : 'ninja').absolutePath

            delete buildDir
            buildDir.mkdirs(); installDir.mkdirs()
            def ndk = android.ndkDirectory?.absolutePath
            if (!ndk) throw new GradleException("NDK not found. Ensure ndkVersion ${android.ndkVersion} is installed.")

            exec {
                workingDir buildDir
                commandLine cmakeExe,
                        '-G', 'Ninja',
                        '-D', "CMAKE_MAKE_PROGRAM=${ninjaExe}",
                        '-D', "CMAKE_TOOLCHAIN_FILE=${ndk}/build/cmake/android.toolchain.cmake",
                        '-D', "ANDROID_ABI=${abi}",
                        '-D', "ANDROID_PLATFORM=android-${minApi}",
                        '-D', "CMAKE_BUILD_TYPE=Release",
                        '-D', "BUILD_SHARED_LIBS=OFF",
                        '-D', "VVDEC_ENABLE_TRACING=OFF",
                        '-D', "VVDEC_LIBRARY_ONLY=ON",
                        '-D', "CMAKE_INSTALL_PREFIX=${installDir.absolutePath}",
                        vvdecSrcDir.absolutePath
            }
            exec { workingDir buildDir; commandLine ninjaExe }
            exec { workingDir buildDir; commandLine ninjaExe, 'install' }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn vvdecAbis.collect { "buildVvdec_${it}" }
}

// dist: produce one ready-to-copy AAR per decoder.

tasks.register('dist') {
    description 'Assembles CPU and Vulkan AARs with classes.dex for the single-class host loader'
    group       'build'
    dependsOn   'assembleRelease'

    doLast {
        def aarIn  = layout.buildDirectory.file('outputs/aar/vcatd-lcevcdec-vvdec-plugin-release.aar').get().asFile
        def distDir = layout.buildDirectory.dir('outputs/dist').get().asFile
        distDir.mkdirs()
        delete fileTree(distDir) { include '*.aar' }

        def btRoot   = new File("${android.sdkDirectory.absolutePath}/build-tools")
        def btLatest = btRoot.listFiles().findAll { it.isDirectory() }
                             .sort { a, b -> b.name <=> a.name }.first()
        def onWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def d8Exe    = new File(btLatest, onWindows ? 'd8.bat' : 'd8')

        def tmpDir     = layout.buildDirectory.dir('dist-tmp').get().asFile
        tmpDir.mkdirs()
        def classesJar = new File(tmpDir, 'classes.jar')
        new java.util.zip.ZipFile(aarIn).withCloseable { zip ->
            classesJar.bytes = zip.getInputStream(zip.getEntry('classes.jar')).bytes
        }

        def dexDir = new File(tmpDir, 'dex')
        dexDir.mkdirs()
        exec {
            commandLine d8Exe.absolutePath,
                    '--output', dexDir.absolutePath,
                    '--min-api', minApi.toString(),
                    '--release',
                    classesJar.absolutePath
        }

        [
            vulkan: 'com.roncatech.libvcat.lcevcvvdec.VcatLcevcVvdecVulkanPlugin',
            cpu: 'com.roncatech.libvcat.lcevcvvdec.VcatLcevcVvdecCpuPlugin'
        ].each { pipeline, pluginClass ->
            def aarOut = new File(distDir, "vcatd-lcevcdec-vvdec-${pipeline}-plugin.aar")
            new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(aarOut)).withCloseable { zos ->
                new java.util.zip.ZipFile(aarIn).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (entry.name != 'assets/plugin-manifest.json') {
                            zos.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (!entry.isDirectory()) zos.write(zip.getInputStream(entry).bytes)
                            zos.closeEntry()
                        }
                    }
                }
                zos.putNextEntry(new java.util.zip.ZipEntry('assets/plugin-manifest.json'))
                zos.write("{\"pluginClass\":\"${pluginClass}\",\"loaderClass\":\"com.roncatech.libvcat.lcevcvvdec.LcevcVvdecLibrary\"}\n".getBytes('UTF-8'))
                zos.closeEntry()
                zos.putNextEntry(new java.util.zip.ZipEntry('classes.dex'))
                zos.write(new File(dexDir, 'classes.dex').bytes)
                zos.closeEntry()
            }
            logger.lifecycle("dist → ${aarOut.absolutePath}")
        }
    }
}

// Publishing.

tasks.register('androidJavadocJar', Jar) { archiveClassifier = 'javadoc' }

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                artifact(tasks.named('androidJavadocJar'))

                groupId    = project.group
                artifactId = 'vcatd-lcevcdec-vvdec-plugin'
                version    = project.version

                pom {
                    name.set('VCAT vvdec decoder plugin')
                    description.set('VVC/H.266 software decoder plugin for VCAT (vvdec)')
                    licenses {
                        license {
                            name.set('GPL-3.0-or-later')
                            url.set('https://www.gnu.org/licenses/gpl-3.0.html')
                        }
                    }
                }
            }
        }
    }

    tasks.named('publishReleasePublicationToMavenLocal') {
        dependsOn 'assembleRelease'
    }
}

// Dependencies.
dependencies {
    compileOnly 'com.roncatech.vcat:vcatd-decoder-plugin-api:1.0.4'
    compileOnly 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    compileOnly 'androidx.annotation:annotation:1.7.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.android.exoplayer:exoplayer-core:2.19.1'
    testImplementation 'com.roncatech.vcat:vcatd-decoder-plugin-api:1.0.4'
}
