plugins {
    id 'com.android.library' version '8.7.3' apply false
}

// ./gradlew dist → app/build/outputs/dist/{vulkan,cpu} plugin AARs
tasks.register("dist") {
    group       = "build"
    description = "Build CPU and Vulkan plugin AARs in app/build/outputs/dist/"
    dependsOn(":vcatd-lcevcdec-vvdec-plugin:dist")
}

// ./gradlew publishPlugin  →  Maven Local
tasks.register("publishPlugin") {
    group       = "build"
    description = "Build and publish vcatd-lcevcdec-vvdec-plugin to Maven Local"
    dependsOn(":vcatd-lcevcdec-vvdec-plugin:publishReleasePublicationToMavenLocal")
    doLast {
        println("\nPublished to Maven Local:")
        println("  com.roncatech.vcat:vcatd-lcevcdec-vvdec-plugin:0.0.1")
        println("\nLocation: ${System.getProperty('user.home')}/.m2/repository/com/roncatech/vcat/vcatd-lcevcdec-vvdec-plugin/")
    }
}
